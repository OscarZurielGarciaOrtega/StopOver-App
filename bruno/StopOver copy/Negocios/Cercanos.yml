info:
  name: Cercanos
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/negocios/cercanos?lat=17.45&lng=-96.90&radioKm=10"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  params:
    - name: lat
      value: "17.45"
      type: query
    - name: lng
      value: "-96.90"
      type: query
    - name: radioKm
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
